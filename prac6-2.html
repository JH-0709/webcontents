<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>animation</title>
        <style>
            @keyframes bob{
                0%{transform: rotate(0deg);}
                50%{transform: rotate(-90deg);}
                100%{transform: rotate(90deg);}
            }
            img{
                animation-name: bob;
                animation-duration: 1s;
                animation-iteration-count:infinite;
            }
        </style>
    </head>    
    <body>
        <h3>어지러워요</h3>
        <hr>
        <img src="media/sponjibob.png" width="100" height="100">
    </body>
</html>
